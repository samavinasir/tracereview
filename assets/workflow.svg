<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">TraceReview workflow</title><desc id="d">A research question flows through four steps: search, rank, digest and verify. Every step is recorded in the audit trail. The result is paper cards and a report.</desc><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243c"/><stop offset="1" stop-color="#1a2f47"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7d2"/><stop offset="1" stop-color="#20b8aa" stop-opacity="0"/></linearGradient></defs><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#6ee7d2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="164" y="2" width="872" height="252" rx="26" fill="#20b8aa" fill-opacity=".06" stroke="#4b8a99" stroke-dasharray="6 7"/><text x="188" y="36" fill="#7ff0dc" font-size="13" font-weight="600" letter-spacing="1.6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">AUDIT TRAIL  ·  EVERY STEP IS LOGGED</text><rect x="1" y="80.0" width="122" height="96" rx="22" fill="#172b45" stroke="#20b8aa" stroke-width="2"/><text x="62" y="122.0" text-anchor="middle" fill="#f1f7ff" font-size="16" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Research</text><text x="62" y="146.0" text-anchor="middle" fill="#f1f7ff" font-size="16" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">question</text><rect x="1077" y="80.0" width="122" height="96" rx="22" fill="#d5f7ef" stroke="#20b8aa" stroke-width="2"/><text x="1138" y="122.0" text-anchor="middle" fill="#123d3a" font-size="16" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Paper cards</text><text x="1138" y="146.0" text-anchor="middle" fill="#123d3a" font-size="16" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">&amp; report</text><path d="M125 128.0H162" stroke="#6ee7d2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><path d="M1038 128.0H1075" stroke="#6ee7d2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="188" y="56" width="192" height="176" rx="18" fill="url(#card)" stroke="#2f566b"/><circle cx="222" cy="92" r="15" fill="#203f58" stroke="#4b7e91"/><text x="222" y="97.5" text-anchor="middle" fill="#7ff0dc" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">1</text><text x="246" y="98" fill="#f1f7ff" font-size="20" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Search</text><text x="208" y="138" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Query configured</text><text x="208" y="160" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">providers for</text><text x="208" y="182" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">candidate papers</text><path d="M383 144.0h18" stroke="#6ee7d2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="404" y="56" width="192" height="176" rx="18" fill="url(#card)" stroke="#2f566b"/><circle cx="438" cy="92" r="15" fill="#203f58" stroke="#4b7e91"/><text x="438" y="97.5" text-anchor="middle" fill="#7ff0dc" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">2</text><text x="462" y="98" fill="#f1f7ff" font-size="20" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Rank</text><text x="424" y="138" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Deduplicate records,</text><text x="424" y="160" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">then rank (lexical,</text><text x="424" y="182" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">deterministic)</text><path d="M599 144.0h18" stroke="#6ee7d2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="620" y="56" width="192" height="176" rx="18" fill="url(#card)" stroke="#2f566b"/><circle cx="654" cy="92" r="15" fill="#203f58" stroke="#4b7e91"/><text x="654" y="97.5" text-anchor="middle" fill="#7ff0dc" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">3</text><text x="678" y="98" fill="#f1f7ff" font-size="20" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Digest</text><text x="640" y="138" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Concise summaries</text><text x="640" y="160" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">and neutral</text><text x="640" y="182" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">relevance notes</text><path d="M815 144.0h18" stroke="#6ee7d2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="836" y="56" width="192" height="176" rx="18" fill="url(#card)" stroke="#2f566b"/><circle cx="870" cy="92" r="15" fill="#203f58" stroke="#4b7e91"/><text x="870" y="97.5" text-anchor="middle" fill="#7ff0dc" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">4</text><text x="894" y="98" fill="#f1f7ff" font-size="20" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Verify</text><text x="856" y="138" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Check quotes against</text><text x="856" y="160" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">source text, with</text><text x="856" y="182" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">verbatim abstract</text><text x="856" y="204" fill="#b4c4d6" font-size="15" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">sentences as fallback</text></svg>