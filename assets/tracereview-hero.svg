<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">TraceReview — literature review you can trace</title>
  <desc id="desc">Headline: Find the papers. Follow the evidence. An animated research desk where paper records connect to highlighted source excerpts through traceable citation paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b33"/><stop offset="1" stop-color="#182b43"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8ba2bd" stroke-opacity=".12" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#030916" flood-opacity=".35"/></filter>
    <style>
      .label{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px}
      .mono{font:11px ui-monospace,SFMono-Regular,Consolas,monospace}
      .small{font:13px ui-sans-serif,system-ui,sans-serif}
      .body{font:16px ui-sans-serif,system-ui,sans-serif}
      .path{fill:none;stroke:#54d9c6;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 8;animation:trace 5s linear infinite}
      .dot{fill:#75ead8;animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .halo{fill:#75ead8;opacity:.18}
      .float1{animation:float 4.5s ease-in-out infinite}
      .float2{animation:float 5s ease-in-out -1.5s infinite}
      .float3{animation:float 4.2s ease-in-out -2.2s infinite}
      @keyframes trace{to{stroke-dashoffset:-120}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media(prefers-reduced-motion:reduce){.path,.dot,.float1,.float2,.float3{animation:none}.pkt{display:none}}
    </style>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="45" r="190" fill="#1b6170" opacity=".12"/>
  <circle cx="95" cy="410" r="180" fill="#405b9b" opacity=".12"/>

  <g transform="translate(54 54)">
    <rect width="46" height="46" rx="13" fill="#203f58" stroke="#4b7e91"/>
    <path d="M13 12h15l6 6v18H13z" fill="none" stroke="#b6fff0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M28 12v7h6M17 24h13M17 29h10" fill="none" stroke="#62dfcb" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="19" fill="#f1f7ff" font-size="26" font-weight="750" font-family="ui-sans-serif,system-ui,sans-serif">TraceReview</text>
    <text x="61" y="42" fill="#9fb6cb" font-size="12" letter-spacing="1.2" font-family="ui-sans-serif,system-ui,sans-serif">LITERATURE REVIEW YOU CAN TRACE</text>
  </g>
  <g transform="translate(55 158)">
    <text class="label" fill="#75ead8">DISCOVER</text>
    <text y="35" fill="#f4f8ff" font-size="28" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Find the papers.</text>
    <text y="68" fill="#f4f8ff" font-size="28" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Follow the evidence.</text>
    <text y="104" fill="#b4c4d6" class="body">A focused reading aid for scientific literature.</text>
    <text y="128" fill="#b4c4d6" class="body">Every excerpt stays connected to its source.</text>
    <g transform="translate(0 160)">
      <rect width="128" height="32" rx="8" fill="#213c50" stroke="#396174"/>
      <circle cx="16" cy="16" r="4" fill="#6ee7d2"/><text x="28" y="20.5" class="small" fill="#d7fdf6">Source-linked</text>
      <rect x="138" width="112" height="32" rx="8" fill="#213c50" stroke="#396174"/>
      <path d="M152 16l4 4 8-9" fill="none" stroke="#6ee7d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="171" y="20.5" class="small" fill="#d7fdf6">Auditable</text>
    </g>
  </g>

  <!-- Animated evidence paths connect records to the excerpt card. -->
  <path id="p1" class="path" d="M618 140 C700 140 704 193 792 193"/>
  <path id="p2" class="path" d="M632 270 C710 270 714 247 792 247" style="animation-delay:-1.5s"/>
  <path id="p3" class="path" d="M626 372 C715 372 713 302 792 302" style="animation-delay:-3s"/>
  <g class="pkt" fill="#b6fff0">
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.2s" begin="-1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.2s" begin="-2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>
  <g><circle class="halo" cx="704" cy="165" r="9"/><circle class="dot" cx="704" cy="165" r="4"/>
     <circle class="halo" cx="722" cy="262" r="9"/><circle class="dot" cx="722" cy="262" r="4"/>
     <circle class="halo" cx="712" cy="334" r="9"/><circle class="dot" cx="712" cy="334" r="4"/></g>

  <g transform="translate(478 82) rotate(-5 78 54)"><g class="float1"><g filter="url(#shadow)">
    <rect width="155" height="112" rx="9" fill="#f7fafc"/>
    <rect width="155" height="25" rx="9" fill="#dce8f0"/><rect y="17" width="155" height="8" fill="#dce8f0"/>
    <circle cx="14" cy="12" r="3" fill="#e58a85"/><circle cx="24" cy="12" r="3" fill="#e7c36e"/><circle cx="34" cy="12" r="3" fill="#66cbb8"/>
    <text x="13" y="43" fill="#24394b" class="label">PAPER RECORD</text>
    <rect x="13" y="52" width="112" height="5" rx="2" fill="#9aafbd"/><rect x="13" y="63" width="126" height="5" rx="2" fill="#c2d0d9"/><rect x="13" y="74" width="102" height="5" rx="2" fill="#c2d0d9"/>
    <rect x="13" y="87" width="70" height="16" rx="4" fill="#d6f6ee"/><text x="20" y="98.5" fill="#167c72" font-size="10" font-family="ui-monospace,monospace">DOI MATCH</text>
  </g></g></g>
  <g transform="translate(495 215) rotate(4 74 57)"><g class="float2"><g filter="url(#shadow)">
    <rect width="150" height="112" rx="9" fill="#f7fafc"/>
    <rect width="150" height="25" rx="9" fill="#dce8f0"/><rect y="17" width="150" height="8" fill="#dce8f0"/>
    <circle cx="14" cy="12" r="3" fill="#e58a85"/><circle cx="24" cy="12" r="3" fill="#e7c36e"/><circle cx="34" cy="12" r="3" fill="#66cbb8"/>
    <text x="13" y="43" fill="#24394b" class="label">ABSTRACT</text>
    <rect x="13" y="52" width="120" height="5" rx="2" fill="#aabdc9"/><rect x="13" y="63" width="111" height="5" rx="2" fill="#c2d0d9"/>
    <rect x="11" y="72" width="124" height="14" rx="3" fill="#baf2e5"/><rect x="13" y="77" width="112" height="5" rx="2" fill="#4da99a"/>
    <rect x="13" y="94" width="83" height="5" rx="2" fill="#c2d0d9"/>
  </g></g></g>
  <g transform="translate(468 337) rotate(-3 89 40)"><g class="float3"><g filter="url(#shadow)">
    <rect width="178" height="80" rx="9" fill="#f7fafc"/>
    <text x="13" y="21" fill="#24394b" class="label">AUDIT EVENT</text>
    <circle cx="17" cy="39" r="4" fill="#20b8aa"/><text x="28" y="43" fill="#385467" class="mono">quote_validation</text>
    <circle cx="17" cy="58" r="4" fill="#20b8aa"/><text x="28" y="62" fill="#385467" class="mono">source_record_match</text>
  </g></g></g>

  <g transform="translate(786 143)" filter="url(#shadow)">
    <rect width="352" height="218" rx="15" fill="#f8fbfd"/>
    <path d="M0 15Q0 0 15 0H337Q352 0 352 15V43H0Z" fill="#dce8f0"/>
    <circle cx="18" cy="21" r="4" fill="#e58a85"/><circle cx="31" cy="21" r="4" fill="#e7c36e"/><circle cx="44" cy="21" r="4" fill="#66cbb8"/>
    <text x="63" y="25" fill="#3a5366" class="label">SOURCE-MATCHED EXCERPT</text>
    <text x="22" y="69" fill="#25394b" font-size="13" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Key finding</text>
    <rect x="16" y="80" width="320" height="30" rx="5" fill="#c7f5e9"/>
    <text x="24" y="100" fill="#14564f" font-size="13" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Error rates fell by roughly a third.</text>
    <rect x="20" y="122" width="286" height="7" rx="3" fill="#c9d6df"/><rect x="20" y="136" width="230" height="7" rx="3" fill="#c9d6df"/>
    <path d="M22 158h307" stroke="#d8e2e9"/>
    <text x="22" y="179" fill="#167c72" class="label">TRACE BACK TO RECORD</text>
    <path d="M22 191h72" stroke="#20b8aa" stroke-width="2.5" stroke-linecap="round"/><path d="M88 185l7 6-7 6" fill="none" stroke="#20b8aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="111" y="195.5" fill="#46606f" font-size="12" font-family="ui-monospace,monospace">abstract · sentence-level</text>
  </g>
  <text x="1138" y="424" text-anchor="end" fill="#8aa3b8" font-size="12" font-family="ui-monospace,monospace">RETRIEVE  /  REVIEW  /  TRACE</text>
</svg>
