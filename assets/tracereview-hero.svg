```svg
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">TraceReview — Literature review you can trace</title>
  <desc id="desc">TraceReview connects scientific paper discovery, source-matched excerpts, and an auditable research workflow.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1424"/>
      <stop offset="1" stop-color="#152B40"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#85F3DE"/>
      <stop offset="1" stop-color="#39C9B5"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#192E43"/>
      <stop offset="1" stop-color="#132438"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9CB4CB" stroke-opacity=".055"/>
    </pattern>

    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030916" flood-opacity=".25"/>
    </filter>

    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .muted { fill: #8FA7BD; }
      .light { fill: #EDF5FC; }
      .mint { fill: #76E7D4; }
      .line { stroke: #2C465D; stroke-width: 1; }
      .paper-line { fill: #B8C9D7; }
      .trace {
        fill: none;
        stroke: #69E2CE;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 5 7;
        animation: travel 6s linear infinite;
      }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes travel {
        to { stroke-dashoffset: -96; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .75; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace, .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" rx="22" fill="url(#background)"/>
  <rect width="1200" height="460" rx="22" fill="url(#grid)"/>
  <circle cx="1070" cy="60" r="220" fill="#1D6670" opacity=".10"/>
  <circle cx="160" cy="430" r="190" fill="#4163A0" opacity=".08"/>

  <!-- Brand -->
  <g transform="translate(58 58)" class="ui">
    <rect width="42" height="42" rx="12" fill="#19374A" stroke="#356477"/>

    <path d="M12 9H25L31 15V33H12Z"
          fill="none" stroke="url(#accent)" stroke-width="1.8"
          stroke-linejoin="round"/>
    <path d="M25 9V16H31M16 21H27M16 26H25"
          fill="none" stroke="#76E7D4" stroke-width="1.8"
          stroke-linecap="round"/>

    <text x="55" y="23" fill="#F3F7FC" font-size="27" font-weight="720" letter-spacing="-.8">TraceReview</text>
    <text x="56" y="44" class="muted mono" font-size="10" letter-spacing="1.8">OPEN-SOURCE RESEARCH WORKFLOW</text>
  </g>

  <!-- Message -->
  <g transform="translate(60 166)" class="ui">
    <rect width="92" height="24" rx="12" fill="#183B43" stroke="#28665F"/>
    <circle cx="13" cy="12" r="3" fill="#76E7D4"/>
    <text x="23" y="16" class="mint mono" font-size="9" letter-spacing="1.1">EVIDENCE FIRST</text>

    <text x="0" y="67" class="light" font-size="37" font-weight="750" letter-spacing="-1.4">Literature review</text>
    <text x="0" y="108" class="light" font-size="37" font-weight="750" letter-spacing="-1.4">you can <tspan fill="#76E7D4">trace.</tspan></text>

    <text x="1" y="145" fill="#B0C2D2" font-size="14">Find papers. Inspect evidence.</text>
    <text x="1" y="166" fill="#B0C2D2" font-size="14">Follow every excerpt back to its source.</text>

    <!-- Compact capabilities -->
    <g transform="translate(0 192)">
      <rect width="125" height="30" rx="7" fill="#172D40" stroke="#304D61"/>
      <path d="M13 15L17 19L24 11" fill="none" stroke="#76E7D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="19" fill="#DCE9F3" font-size="11">Source-linked</text>

      <rect x="135" width="105" height="30" rx="7" fill="#172D40" stroke="#304D61"/>
      <path d="M149 11V20M145 16L149 20L153 16" fill="none" stroke="#76E7D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="19" fill="#DCE9F3" font-size="11">Auditable</text>
    </g>
  </g>

  <!-- Product preview -->
  <g transform="translate(474 63)" filter="url(#shadow)">
    <rect width="668" height="336" rx="15" fill="#101D2D" stroke="#365167"/>

    <!-- App chrome -->
    <path d="M15 0H653Q668 0 668 15V43H0V15Q0 0 15 0Z" fill="#20364A"/>
    <circle cx="19" cy="21" r="4" fill="#EF928C"/>
    <circle cx="33" cy="21" r="4" fill="#E8C777"/>
    <circle cx="47" cy="21" r="4" fill="#70D6BD"/>

    <text x="66" y="25" class="ui" fill="#DDE8F1" font-size="11" font-weight="600">TraceReview</text>
    <rect x="555" y="11" width="95" height="20" rx="6" fill="#183F40" stroke="#28685F"/>
    <circle cx="567" cy="21" r="3" fill="#76E7D4"/>
    <text x="576" y="25" class="mono" fill="#A4F0E1" font-size="9">WORKFLOW</text>

    <!-- Left: search results -->
    <g transform="translate(17 60)">
      <text class="mono" fill="#8FA7BD" font-size="9" letter-spacing="1.2">PAPER DISCOVERY</text>

      <!-- Search input -->
      <rect y="15" width="296" height="34" rx="7" fill="#0D1A29" stroke="#334D62"/>
      <circle cx="14" cy="30" r="5" fill="none" stroke="#81A0B8" stroke-width="1.4"/>
      <path d="M18 34L22 38" stroke="#81A0B8" stroke-width="1.4" stroke-linecap="round"/>
      <text x="30" y="34" class="ui" fill="#B8C9D7" font-size="10">Research question or topic...</text>

      <!-- Result one -->
      <rect y="61" width="296" height="77" rx="8" fill="#172B3D" stroke="#2D465A"/>
      <rect x="11" y="72" width="27" height="33" rx="4" fill="#23465A"/>
      <path d="M18 80H31M18 85H31M18 90H28" stroke="#84E5D3" stroke-width="1.4" stroke-linecap="round"/>
      <text x="48" y="80" class="ui" fill="#EDF5FC" font-size="10.5" font-weight="650">Study on research outcomes</text>
      <text x="48" y="96" class="ui muted" font-size="9.5">Abstract · Journal article</text>
      <rect x="48" y="108" width="75" height="17" rx="5" fill="#203D4A"/>
      <text x="56" y="120" class="mono" fill="#90E7D7" font-size="8">SOURCE FOUND</text>

      <!-- Result two -->
      <rect y="147" width="296" height="77" rx="8" fill="#172B3D" stroke="#2D465A"/>
      <rect x="11" y="158" width="27" height="33" rx="4" fill="#23465A"/>
      <path d="M18 166H31M18 171H31M18 176H28" stroke="#84E5D3" stroke-width="1.4" stroke-linecap="round"/>
      <text x="48" y="166" class="ui" fill="#EDF5FC" font-size="10.5" font-weight="650">Related evidence and findings</text>
      <text x="48" y="182" class="ui muted" font-size="9.5">Abstract · Research paper</text>
      <rect x="48" y="194" width="91" height="17" rx="5" fill="#25374A"/>
      <text x="56" y="206" class="mono" fill="#B8C9D7" font-size="8">RELEVANCE RANK</text>

      <text x="1" y="247" class="mono" fill="#6F899F" font-size="9">DEDUPLICATED · RANKED</text>
    </g>

    <!-- Evidence connection -->
    <path class="trace" d="M315 180 C340 180 334 145 359 145"/>
    <circle class="pulse" cx="335" cy="164" r="4" fill="#76E7D4"/>

    <!-- Right: excerpt panel -->
    <g transform="translate(360 76)">
      <rect width="290" height="232" rx="10" fill="#F5F8FB"/>
      <path d="M10 0H280Q290 0 290 10V38H0V10Q0 0 10 0Z" fill="#E2EAF1"/>
      <circle cx="14" cy="19" r="3" fill="#DDE6ED"/>
      <text x="25" y="22" class="mono" fill="#536A7B" font-size="9" letter-spacing=".8">EVIDENCE VIEW</text>
      <rect x="220" y="10" width="58" height="18" rx="5" fill="#D2F4E9"/>
      <text x="228" y="22" class="mono" fill="#197C6D" font-size="8">MATCHED</text>

      <text x="16" y="63" class="ui" fill="#20394C" font-size="13" font-weight="700">Source-matched excerpt</text>
      <text x="16" y="83" class="ui" fill="#607586" font-size="10">Selected from the source abstract</text>

      <!-- Highlighted excerpt -->
      <rect x="14" y="99" width="262" height="24" rx="4" fill="#C9F3E8"/>
      <rect x="21" y="108" width="227" height="5" rx="2" fill="#4EAC9B"/>
      <rect x="14" y="128" width="241" height="7" rx="3" fill="#D6E0E8"/>
      <rect x="14" y="142" width="213" height="7" rx="3" fill="#D6E0E8"/>

      <path d="M15 165H275" stroke="#DDE5EB"/>
      <circle cx="20" cy="184" r="5" fill="#D1F3E8"/>
      <path d="M17 184L19 186L23 181" fill="none" stroke="#198A78" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="188" class="ui" fill="#247C70" font-size="10" font-weight="650">Source text checked</text>

      <path d="M16 205H48" stroke="#25B9A6" stroke-width="2" stroke-linecap="round"/>
      <path d="M42 200L48 205L42 210" fill="none" stroke="#25B9A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="209" class="mono" fill="#61788A" font-size="9">RETURN TO PAPER</text>
    </g>
  </g>

  <!-- Footer -->
  <g class="mono" font-size="9" letter-spacing="1">
    <text x="60" y="430" fill="#6F899F">DISCOVER</text>
    <circle cx="119" cy="426" r="2" fill="#69DCC9"/>
    <text x="132" y="430" fill="#6F899F">REVIEW</text>
    <circle cx="181" cy="426" r="2" fill="#69DCC9"/>
    <text x="194" y="430" fill="#6F899F">TRACE</text>
    <text x="1140" y="430" text-anchor="end" fill="#6F899F">BUILT FOR TRANSPARENT RESEARCH</text>
  </g>
</svg>
```
