<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">TraceReview — literature review you can trace</title>
  <desc id="desc">An animated research desk where paper records connect to highlighted source excerpts through traceable citation paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b33"/><stop offset="1" stop-color="#182b43"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7d2"/><stop offset="1" stop-color="#20b8aa"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8ba2bd" stroke-opacity=".12" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#030916" flood-opacity=".35"/></filter>
    <style>
      .label{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px}
      .small{font:12px ui-sans-serif,system-ui,sans-serif}
      .body{font:14px ui-sans-serif,system-ui,sans-serif}
      .path{fill:none;stroke:#54d9c6;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 8;animation:trace 5s linear infinite}
      .dot{fill:#75ead8;filter:url(#shadow);animation:pulse 2s ease-in-out infinite}
      .float1{animation:float 4.5s ease-in-out infinite}
      .float2{animation:float 5s ease-in-out -1.5s infinite}
      .float3{animation:float 4.2s ease-in-out -2.2s infinite}
      @keyframes trace{to{stroke-dashoffset:-120}}
      @keyframes pulse{0%,100%{r:4;opacity:.8}50%{r:6;opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.path,.dot,.float1,.float2,.float3{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="45" r="190" fill="#1b6170" opacity=".12"/>
  <circle cx="95" cy="410" r="180" fill="#405b9b" opacity=".12"/>

  <g transform="translate(54 54)">
    <rect width="46" height="46" rx="13" fill="#203f58" stroke="#4b7e91"/>
    <path d="M13 12h15l6 6v18H13z" fill="none" stroke="#b6fff0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M28 12v7h6M17 24h13M17 29h10" fill="none" stroke="#62dfcb" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="19" fill="#f1f7ff" font-size="26" font-weight="750" font-family="ui-sans-serif,system-ui,sans-serif">TraceReview</text>
    <text x="61" y="42" fill="#9fb6cb" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">LITERATURE REVIEW YOU CAN TRACE</text>
  </g>
  <g transform="translate(55 150)">
    <text class="label" fill="#75ead8">DISCOVER</text>
    <text y="35" fill="#f4f8ff" font-size="28" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Find the papers.</text>
    <text y="68" fill="#f4f8ff" font-size="28" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Follow the evidence.</text>
    <text y="103" fill="#b4c4d6" class="body">A focused reading aid for scientific literature.</text>
    <text y="126" fill="#b4c4d6" class="body">Every excerpt stays connected to its source.</text>
    <g transform="translate(0 157)">
      <rect width="120" height="30" rx="8" fill="#213c50" stroke="#396174"/>
      <circle cx="15" cy="15" r="4" fill="#6ee7d2"/><text x="27" y="19" class="small" fill="#d7fdf6">Source-linked</text>
      <rect x="130" width="104" height="30" rx="8" fill="#213c50" stroke="#396174"/>
      <path d="M144 15l4 4 8-9" fill="none" stroke="#6ee7d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="19" class="small" fill="#d7fdf6">Auditable</text>
    </g>
  </g>

  <!-- Animated evidence paths connect records to the excerpt card. -->
  <path class="path" d="M630 137 C700 137 704 193 777 193"/>
  <path class="path" d="M646 270 C710 270 714 247 777 247" style="animation-delay:-1.5s"/>
  <path class="path" d="M642 367 C715 367 713 302 777 302" style="animation-delay:-3s"/>
  <circle class="dot" cx="704" cy="163" r="4"/><circle class="dot" cx="721" cy="265" r="4"/><circle class="dot" cx="704" cy="337" r="4"/>

  <g class="float1" transform="translate(478 82) rotate(-5 78 54)" filter="url(#shadow)">
    <rect width="155" height="112" rx="9" fill="#f7fafc"/>
    <rect width="155" height="25" rx="9" fill="#dce8f0"/><rect y="17" width="155" height="8" fill="#dce8f0"/>
    <circle cx="14" cy="12" r="3" fill="#e58a85"/><circle cx="24" cy="12" r="3" fill="#e7c36e"/><circle cx="34" cy="12" r="3" fill="#66cbb8"/>
    <text x="13" y="43" fill="#24394b" class="label" font-size="9">PAPER RECORD</text>
    <rect x="13" y="52" width="112" height="5" rx="2" fill="#9aafbd"/><rect x="13" y="63" width="126" height="5" rx="2" fill="#c2d0d9"/><rect x="13" y="74" width="102" height="5" rx="2" fill="#c2d0d9"/>
    <rect x="13" y="88" width="58" height="13" rx="4" fill="#d6f6ee"/><text x="19" y="97" fill="#167c72" font-size="8" font-family="monospace">DOI MATCH</text>
  </g>
  <g class="float2" transform="translate(495 215) rotate(4 74 57)" filter="url(#shadow)">
    <rect width="150" height="112" rx="9" fill="#f7fafc"/>
    <rect width="150" height="25" rx="9" fill="#dce8f0"/><rect y="17" width="150" height="8" fill="#dce8f0"/>
    <circle cx="14" cy="12" r="3" fill="#e58a85"/><circle cx="24" cy="12" r="3" fill="#e7c36e"/><circle cx="34" cy="12" r="3" fill="#66cbb8"/>
    <text x="13" y="43" fill="#24394b" class="label" font-size="9">ABSTRACT</text>
    <rect x="13" y="52" width="120" height="5" rx="2" fill="#aabdc9"/><rect x="13" y="63" width="111" height="5" rx="2" fill="#c2d0d9"/>
    <rect x="11" y="72" width="124" height="14" rx="3" fill="#baf2e5"/><rect x="13" y="77" width="112" height="5" rx="2" fill="#4da99a"/>
    <rect x="13" y="94" width="83" height="5" rx="2" fill="#c2d0d9"/>
  </g>
  <g class="float3" transform="translate(474 337) rotate(-3 80 43)" filter="url(#shadow)">
    <rect width="164" height="80" rx="9" fill="#f7fafc"/>
    <text x="13" y="21" fill="#24394b" class="label" font-size="9">AUDIT EVENT</text>
    <circle cx="17" cy="39" r="4" fill="#20b8aa"/><text x="28" y="43" fill="#385467" font-size="10" font-family="ui-monospace,monospace">quote_validation</text>
    <circle cx="17" cy="58" r="4" fill="#20b8aa"/><text x="28" y="62" fill="#385467" font-size="10" font-family="ui-monospace,monospace">source_record_match</text>
  </g>

  <g transform="translate(786 143)" filter="url(#shadow)">
    <rect width="352" height="218" rx="15" fill="#f8fbfd"/>
    <path d="M0 15Q0 0 15 0H337Q352 0 352 15V43H0Z" fill="#dce8f0"/>
    <circle cx="18" cy="21" r="4" fill="#e58a85"/><circle cx="31" cy="21" r="4" fill="#e7c36e"/><circle cx="44" cy="21" r="4" fill="#66cbb8"/>
    <text x="63" y="25" fill="#3a5366" class="label" font-size="9">SOURCE-MATCHED EXCERPT</text>
    <text x="22" y="69" fill="#25394b" font-size="13" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Key finding</text>
    <rect x="20" y="83" width="308" height="27" rx="5" fill="#c7f5e9"/>
    <rect x="28" y="92" width="267" height="5" rx="2" fill="#258f83"/>
    <rect x="20" y="119" width="286" height="7" rx="3" fill="#c9d6df"/><rect x="20" y="133" width="250" height="7" rx="3" fill="#c9d6df"/>
    <path d="M22 158h307" stroke="#d8e2e9"/>
    <text x="22" y="179" fill="#167c72" class="label" font-size="9">TRACE BACK TO RECORD</text>
    <path d="M22 191h72" stroke="#20b8aa" stroke-width="2.5" stroke-linecap="round"/><path d="M88 185l7 6-7 6" fill="none" stroke="#20b8aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="111" y="195" fill="#526b7b" font-size="10" font-family="ui-monospace,monospace">abstract · sentence-level</text>
  </g>
  <text x="1142" y="428" text-anchor="end" fill="#7892a8" font-size="10" font-family="ui-monospace,monospace">RETRIEVE  /  REVIEW  /  TRACE</text>
</svg>
