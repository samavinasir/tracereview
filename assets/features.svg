<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">TraceReview features</title><desc id="d">Four feature cards: literature discovery, AI-assisted reading, traceable excerpts, and auditable workflows.</desc><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243c"/><stop offset="1" stop-color="#1a2f47"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7d2"/><stop offset="1" stop-color="#20b8aa" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="588" height="180" rx="20" fill="url(#card)" stroke="#2f566b"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><rect x="28" y="28" width="52" height="52" rx="14" fill="#203f58" stroke="#4b7e91"/><g transform="translate(40.2 40.2) scale(1.15)" fill="none" stroke="#7ff0dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L22 22"/></g><text x="100" y="62" fill="#f1f7ff" font-size="24" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Literature discovery</text><text x="28" y="120" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Search scientific literature across configured</text><text x="28" y="147" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">providers and deduplicate records.</text><rect x="612" y="0" width="588" height="180" rx="20" fill="url(#card)" stroke="#2f566b"/><rect x="640" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><rect x="640" y="28" width="52" height="52" rx="14" fill="#203f58" stroke="#4b7e91"/><g transform="translate(652.2 40.2) scale(1.15)" fill="none" stroke="#7ff0dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/><path d="M19 17v4M17 19h4"/></g><text x="712" y="62" fill="#f1f7ff" font-size="24" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">AI-assisted reading</text><text x="640" y="120" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Generate concise study summaries and neutral</text><text x="640" y="147" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">relevance notes.</text><rect x="0" y="204" width="588" height="180" rx="20" fill="url(#card)" stroke="#2f566b"/><rect x="28" y="204" width="64" height="3" rx="1.5" fill="url(#bar)"/><rect x="28" y="232" width="52" height="52" rx="14" fill="#203f58" stroke="#4b7e91"/><g transform="translate(40.2 244.2) scale(1.15)" fill="none" stroke="#7ff0dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g><text x="100" y="266" fill="#f1f7ff" font-size="24" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Traceable excerpts</text><text x="28" y="324" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Check proposed quotations against source text and</text><text x="28" y="351" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">fall back to verbatim abstract sentences when needed.</text><rect x="612" y="204" width="588" height="180" rx="20" fill="url(#card)" stroke="#2f566b"/><rect x="640" y="204" width="64" height="3" rx="1.5" fill="url(#bar)"/><rect x="640" y="232" width="52" height="52" rx="14" fill="#203f58" stroke="#4b7e91"/><g transform="translate(652.2 244.2) scale(1.15)" fill="none" stroke="#7ff0dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></g><text x="712" y="266" fill="#f1f7ff" font-size="24" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Auditable workflows</text><text x="640" y="324" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Inspect retrieval, selection, caching, validation,</text><text x="640" y="351" fill="#b4c4d6" font-size="17" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">and model-fallback events.</text></svg>