[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tracereview"
version = "0.1.0"
description = "Literature review you can trace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<6",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=43,<47",
  "whitenoise>=6.7,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=0.2,<2",
  "langchain-groq>=0.2,<1",
  "langchain-anthropic>=0.3,<1",
  "langchain-google-genai>=4,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "defusedxml>=0.7.1,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auditable_research", "src/tracereview_web"]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
